<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');
  :root {
    --ink: #1a1208; --parchment: #f4ead8; --gold: #8b6914;
    --gold-light: #c4962a; --red: #8b1a1a; --border: #c4962a44;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ink); min-height: 100vh; font-family: 'Crimson Text', Georgia, serif; color: var(--parchment); }
  .masthead { text-align: center; padding: 2rem 1rem 1rem; border-bottom: 1px solid var(--border); }
  .masthead h1 { font-family: 'Cinzel', serif; color: var(--gold-light); letter-spacing: 0.15em; font-size: 1.6rem; }
  .masthead small { opacity: 0.6; display: block; margin-top: 0.4rem; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  .login-box { max-width: 380px; margin: 3rem auto; padding: 1.5rem; border: 1px solid var(--border); background: #0f0c0688; border-radius: 8px; }
  .login-box label { display: block; font-family: 'Cinzel', serif; font-size: 0.8rem; color: var(--gold-light); margin: 0.8rem 0 0.3rem; }
  .login-box select, .login-box input { width: 100%; padding: 0.5rem; background: #0f0c06; border: 1px solid var(--border); color: var(--parchment); border-radius: 4px; font-family: 'Crimson Text', serif; font-size: 1rem; }
  .login-box button { width: 100%; margin-top: 1.2rem; padding: 0.6rem; background: linear-gradient(135deg, var(--gold-light), var(--gold)); border: none; border-radius: 4px; color: var(--ink); font-family: 'Cinzel', serif; font-weight: 700; cursor: pointer; letter-spacing: 0.05em; }
  .login-box button:hover { filter: brightness(1.1); }
  #login-error { color: #e08a8a; font-size: 0.85rem; margin-top: 0.6rem; min-height: 1.2em; }
  .panel { border: 1px solid var(--border); background: #0f0c0655; border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 1rem; }
  .panel-title { font-family: 'Cinzel', serif; color: var(--gold-light); font-size: 1rem; margin-bottom: 0.7rem; letter-spacing: 0.03em; }
  .res-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
  .res-item { text-align: center; padding: 0.5rem; background: #0f0c0644; border-radius: 6px; }
  .res-item .val { font-family: 'Cinzel', serif; font-size: 1.2rem; color: var(--gold-light); }
  .res-item .lbl { font-size: 0.75rem; opacity: 0.7; }
  .row { padding: 0.4rem 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  .row:last-child { border-bottom: none; }
  .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 3px; font-size: 0.7rem; margin-left: 0.4rem; }
  .bar-bg { background: #1a1208; height: 7px; border-radius: 4px; margin-top: 3px; }
  .bar-fill { background: var(--gold-light); height: 7px; border-radius: 4px; }
  .empty { opacity: 0.5; font-size: 0.85rem; font-style: italic; }
  .logout { text-align: center; margin-top: 1.5rem; }
  .logout a { color: var(--gold-light); font-size: 0.85rem; cursor: pointer; text-decoration: underline; }
  #app-view { display: none; }
</style>
</head>

function fnv1aHash(str) {
  var bytes = new TextEncoder().encode(str);
  var h = 0x811c9dc5;
  for (var i = 0; i < bytes.length; i++) {
    h ^= bytes[i];
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(16).padStart(8, '0');
}

function sanitize(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

(function init() {
  var meta = '⚙ ' + sanitize(CHRONICLE_DATA.world_name) + ' — ' + sanitize(CHRONICLE_DATA.month_year) +
    ' (Turno ' + CHRONICLE_DATA.turn + ') · Dati generati il ' + sanitize(CHRONICLE_DATA.generated_at);
  document.getElementById('login-meta').textContent = meta;
  var sel = document.getElementById('login-faction');
  Object.keys(CHRONICLE_DATA.factions).forEach(function(name) {
    var opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    sel.appendChild(opt);
  });
  var remembered = sessionStorage.getItem('orbis_faction');
  if (remembered && CHRONICLE_DATA.factions[remembered]) {
    renderFaction(remembered);
  }
})();

function tryLogin() {
  var fname = document.getElementById('login-faction').value;
  var pwd = document.getElementById('login-password').value;
  var errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!fname) { errEl.textContent = 'Seleziona la tua fazione.'; return; }
  var f = CHRONICLE_DATA.factions[fname];
  if (f.password_hash) {
    if (fnv1aHash(pwd) !== f.password_hash) { errEl.textContent = 'Password errata.'; return; }
  }
  sessionStorage.setItem('orbis_faction', fname);
  renderFaction(fname);
}

function logout() {
  sessionStorage.removeItem('orbis_faction');
  document.getElementById('app-view').style.display = 'none';
  document.getElementById('login-view').style.display = 'block';
  document.getElementById('login-password').value = '';
}

    '<div style="font-size:0.8rem;opacity:0.8">' + sanitize(c.role || '') + (c.type ? ' · ' + sanitize(c.type) : '') + '</div>' +

    '</div>';

function groupBuildingsByRegion(f) {
  // Gli edifici sono testo libero (es. "Fattoria, LV2, C12", "Archivio Reale (capitale)"),
  // non un campo strutturato — qui si cerca un codice di provincia (es. C12, N6, P22) nel
  // testo, ignorando gli indicatori di livello (LV1, LV2...) per non confonderli con un codice.
  // Chi non ha un codice riconoscibile, o menziona esplicitamente la capitale, finisce in un
  // gruppo unico "Capitale / Sede Centrale".
  var buildings = f.buildings || [];
  var territories = f.territories || [];
  var knownCodes = territories.filter(function(t) { return !/capitale/i.test(t); }).map(function(t) { return t.trim(); });

  var groups = {};
  var capitale = [];

  buildings.forEach(function(b) {
    if (/capitale/i.test(b)) { capitale.push(b); return; }
    var cleaned = b.replace(/\bLV\s*\d+\b/gi, '');
    var match = cleaned.match(/\b[A-Za-z]{1,2}\d{1,2}\b/);
    if (match) {
      var code = match[0].toUpperCase();
      groups[code] = groups[code] || [];
      groups[code].push(b);
    } else {
      capitale.push(b);
    }
  });

  // Ordine: prima i codici noti, nell'ordine in cui appaiono nei territori; poi eventuali
  // codici trovati negli edifici ma non ancora registrati come territorio, in ordine alfabetico
  var orderedCodes = [];
  knownCodes.forEach(function(t) {
    Object.keys(groups).forEach(function(code) {
      if (t.toUpperCase().indexOf(code) !== -1 && orderedCodes.indexOf(code) === -1) orderedCodes.push(code);
    });
  });
  Object.keys(groups).sort().forEach(function(code) {
    if (orderedCodes.indexOf(code) === -1) orderedCodes.push(code);
  });

  return { capitale: capitale, regioni: orderedCodes.map(function(code) { return { code: code, buildings: groups[code] }; }) };
}

function renderBuildings(f) {
  var buildings = f.buildings || [];
  var html = '<div class="panel"><div class="panel-title">🏛️ Edifici</div>';
  if (!buildings.length) {
    return html + '<div class="empty">Nessuno oltre le infrastrutture base.</div></div>';
  }
  var g = groupBuildingsByRegion(f);
  if (g.capitale.length) {
    html += '<details open style="margin-bottom:0.4rem"><summary style="cursor:pointer;font-family:\'Cinzel\',serif;font-size:0.85rem;color:var(--gold-light)">🏛️ Capitale / Sede Centrale (' + g.capitale.length + ')</summary>' +
      '<div class="row" style="margin-top:0.3rem;border-bottom:none">' + g.capitale.map(sanitize).join(', ') + '</div></details>';
  }
  g.regioni.forEach(function(r) {
    html += '<details style="margin-bottom:0.4rem"><summary style="cursor:pointer;font-family:\'Cinzel\',serif;font-size:0.85rem;color:var(--gold-light)">📍 ' + sanitize(r.code) + ' (' + r.buildings.length + ')</summary>' +
      '<div class="row" style="margin-top:0.3rem;border-bottom:none">' + r.buildings.map(sanitize).join(', ') + '</div></details>';
  });
  html += '</div>';
  return html;
}
function renderCourt(f) {
  var chars = f.characters || [];
  var active = chars.filter(function(c) { return (c.status || 'attivo') === 'attivo'; });
  var inactive = chars.filter(function(c) { return (c.status || 'attivo') !== 'attivo'; });
  var sovrano = active.filter(function(c) { return c.role === 'Sovrano'; });
  var court = active.filter(function(c) { return c.role !== 'Sovrano'; });

  var html = '<div class="panel"><div class="panel-title">🏛️ La Corte</div>';
  if (sovrano.length) {
    html += sovrano.map(function(c) { return charCardHtml(c, true); }).join('');
  }
  if (court.length) {
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0.6rem;margin-top:' + (sovrano.length ? '0.6rem' : '0') + '">' +
      court.map(function(c) { return charCardHtml(c, false); }).join('') + '</div>';
  }
  if (!sovrano.length && !court.length) {
    html += '<div class="empty">Nessun personaggio registrato.</div>';
  }
  if (inactive.length) {
    html += '<details style="margin-top:0.8rem"><summary style="cursor:pointer;font-family:\'Cinzel\',serif;font-size:0.85rem;color:#c4962a88">⚰️ Memoriale (' + inactive.length + ')</summary>' +
      '<div style="margin-top:0.5rem;opacity:0.65">' +
      inactive.map(function(c) {
        return '<div style="border-top:1px solid var(--border);padding:0.5rem 0;filter:grayscale(0.5)">' +
          '<strong>' + sanitize(c.name) + '</strong> <span style="font-size:0.75rem;opacity:0.7">(' + sanitize(c.status) + ')</span>' +
          (c.notes ? '<div style="font-size:0.8rem;font-style:italic;margin-top:0.2rem">' + sanitize(c.notes) + '</div>' : '') +
          charEventsHtml(c) +
          '</div>';
      }).join('') + '</div></details>';
  }
  html += '</div>';
  return html;
}

function renderFaction(fname) {
  var f = CHRONICLE_DATA.factions[fname];
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('app-view').style.display = 'block';
  document.getElementById('faction-title').textContent = '⚜ ' + fname + ' ⚜';
  document.getElementById('app-meta').textContent = '⚙ ' + sanitize(CHRONICLE_DATA.world_name) + ' — ' + sanitize(CHRONICLE_DATA.month_year) +
    ' (Turno ' + CHRONICLE_DATA.turn + ') · Dati generati il ' + sanitize(CHRONICLE_DATA.generated_at);

  var html = '';

  // Stato generale
  html += '<div class="panel"><div class="panel-title">🏰 Stato del Regno</div>' +
    '<div class="row">Razza: <strong>' + sanitize(f.race) + '</strong> · Zona: <strong>' + sanitize(f.zone) + '</strong></div>' +
    '<div class="row">Militare: <strong>' + f.military + '/10</strong> · Stabilità: <strong>' + f.stability + '/10</strong> · Popolazione: <strong>' + f.population + '/10</strong></div>' +
    '</div>';

  // Corte — sovrano e personaggi attivi in evidenza, deceduti/ritirati nel Memoriale
  html += renderCourt(f);

  // Risorse
  html += '<div class="panel"><div class="panel-title">💰 Risorse</div><div class="res-grid">' +
    Object.keys(RES_ICONS).map(function(r) {
      return '<div class="res-item"><div class="val">' + (f.resources[r] !== undefined ? f.resources[r] : 0) + '</div><div class="lbl">' + RES_ICONS[r] + ' ' + r + '</div></div>';
    }).join('') + '</div></div>';

  // Territori ed edifici
  html += '<div class="panel"><div class="panel-title">🗺️ Territori</div>' +
    (f.territories.length ? '<div class="row">' + f.territories.map(sanitize).join(', ') + '</div>' : '<div class="empty">Solo la capitale.</div>') + '</div>';
  html += renderBuildings(f);

  // Truppe
  var troopKeys = Object.keys(f.troops || {}).filter(function(k) { return f.troops[k] > 0; });
  html += '<div class="panel"><div class="panel-title">⚔️ Truppe</div>' +
    (troopKeys.length ? troopKeys.map(function(t) {
      return '<div class="row">' + sanitize(t) + ': <strong>' + f.troops[t] + '</strong></div>';
    }).join('') : '<div class="empty">Nessuna truppa arruolata.</div>') + '</div>';

  // Ricerche in corso
  html += '<div class="panel"><div class="panel-title">🔬 Ricerche in Corso</div>' +
    (f.researches_active.length ? f.researches_active.map(function(r) {
      var pct = Math.round(r.turni_completati / r.turni_necessari * 100);
      return '<div class="row"><strong>' + sanitize(r.name) + '</strong>' +
        '<span class="badge" style="background:' + (CAT_COLORS[r.category]||'#333') + '">' + (CAT_LABELS[r.category]||'') + '</span><br>' +
        '<span style="font-size:0.8rem;opacity:0.75">' + sanitize(r.effect) + '</span>' +
        '<div class="bar-bg"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '<span style="font-size:0.75rem;opacity:0.6">' + r.turni_completati + ' / ' + r.turni_necessari + ' turni</span></div>';
    }).join('') : '<div class="empty">Nessuna ricerca attiva.</div>') + '</div>';

  // Tecnologie scoperte
  html += '<div class="panel"><div class="panel-title">✅ Tecnologie Scoperte</div>' +
    (f.researches_completed.length ? f.researches_completed.map(function(t) {
      return '<div class="row">' + sanitize(t.name) +
        '<span class="badge" style="background:' + (CAT_COLORS[t.category]||'#333') + '">' + (CAT_LABELS[t.category]||'') + '</span><br>' +
        '<span style="font-size:0.8rem;opacity:0.75">' + sanitize(t.effect) + '</span></div>';
    }).join('') : '<div class="empty">Nessuna tecnologia scoperta.</div>') + '</div>';

  // Artefatti
  html += '<div class="panel"><div class="panel-title">🏺 Artefatti</div>' +
    (f.artifacts.length ? f.artifacts.map(function(a) {
      return '<div class="row"><strong>' + sanitize(a.name) + '</strong> <span style="opacity:0.6;font-size:0.8rem">(' + sanitize(a.rarity) + ')</span><br>' +
        '<span style="font-size:0.8rem;opacity:0.75">' + sanitize(a.description) + '</span></div>';
    }).join('') : '<div class="empty">Nessun artefatto in possesso.</div>') + '</div>';

  // Relazioni diplomatiche
  html += '<div class="panel"><div class="panel-title">🤝 Relazioni Diplomatiche</div>' +
    (f.diplomacy.length ? f.diplomacy.map(function(d) {
      var line = '<div class="row">' + sanitize(d.fazione) +
        '<span class="badge" style="background:' + (DIPL_COLORS[d.stato]||'#555') + '">' + sanitize(d.stato) + '</span>';
      if (d.scambio) {
        var esp = Object.keys(d.scambio.esporta).map(function(r){ return d.scambio.esporta[r] + ' ' + r; }).join(', ') || 'nulla';
        var ric = Object.keys(d.scambio.riceve).map(function(r){ return d.scambio.riceve[r] + ' ' + r; }).join(', ') || 'nulla';
        var durata = d.scambio.turni_rimanenti === null ? 'indefinita' : (d.scambio.turni_rimanenti + ' turni rimanenti');
        line += '<div style="font-size:0.8rem;opacity:0.75;margin-top:0.2rem">Esporta: ' + sanitize(esp) + ' · Riceve: ' + sanitize(ric) + ' · Durata: ' + sanitize(durata) + '</div>';
        var bonusKeys = Object.keys(d.scambio.bonus || {});
        if (bonusKeys.length) {
          var bonusTxt = bonusKeys.map(function(r){ return d.scambio.bonus[r] + ' ' + r; }).join(', ');
          line += '<div style="font-size:0.8rem;opacity:0.75">Guadagno dalla rotta (per turno, non sottratto alla controparte): ' + sanitize(bonusTxt) + '</div>';
        }
        if (d.scambio.note) line += '<div style="font-size:0.75rem;opacity:0.6;font-style:italic">' + sanitize(d.scambio.note) + '</div>';
      }
      line += '</div>';
      return line;
    }).join('') : '<div class="empty">Nessuna relazione diplomatica registrata.</div>') + '</div>';

  document.getElementById('app-content').innerHTML = html;
}
</script>
</body>
</html>
